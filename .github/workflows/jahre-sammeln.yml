name: Jahresreihe sammeln
on:
  workflow_dispatch:
    inputs:
      jahre:
        description: 'Jahre, kommagetrennt (leer = alle)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - run: python -u scripts/collect_jahre.py
        timeout-minutes: 12
        env:
          JAHRE: ${{ inputs.jahre }}
      - if: always()
        run: |
          git config user.name "pilgerstatistik-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Jahresreihe Power BI"
          git pull --rebase
          git push
