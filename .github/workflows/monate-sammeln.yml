name: Monatsreihe sammeln
on:
  workflow_dispatch:
    inputs:
      jahre:
        description: 'Jahre, kommagetrennt'
        required: false
        default: '2025'
      monate:
        description: 'Monatsnummern 1-12, kommagetrennt (leer = alle)'
        required: false
        default: ''
      erkunden:
        description: 'nur Filter anzeigen (1)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          playwright install --with-deps chromium
      - run: python -u scripts/collect_monate.py
        timeout-minutes: 50
        env:
          JAHRE: ${{ inputs.jahre }}
          MONATE: ${{ inputs.monate }}
          ERKUNDEN: ${{ inputs.erkunden }}
      - if: always()
        run: |
          git config user.name "pilgerstatistik-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Monatsreihe Power BI"
          git pull --rebase
          git push
