name: Orte den Gemeinden zuordnen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  zuordnen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/orte_gemeinden.py
      - if: always()
        run: |
          git config user.name "pilgerstatistik-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          git commit -m "Orte den Gemeinden zugeordnet" || echo "nichts zu committen"
          git pull --rebase -q && git push -q
